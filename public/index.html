<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TikTok Chat Overlay Beta</title>
    <style>
        body {
            background-color: transparent; /* Fondo transparente clave para el lienzo */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 10px;
        }
        #chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 100vh;
            width: 400px;
        }
        .chat-message {
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 15px;
            word-break: break-word;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease-in-out;
            border-left: 4px solid #fe2c55; /* Toque estilo TikTok */
        }
        .chat-message span.user {
            font-weight: bold;
            color: #ff3366;
            margin-right: 6px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <!-- Script de Socket.io que provee el servidor local -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatContainer = document.getElementById('chat-container');

        socket.on('nuevo-mensaje', (data) => {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('chat-message');
            messageDiv.innerHTML = `<span class="user">${data.user}:</span>${data.comment}`;
            
            chatContainer.appendChild(messageDiv);

            // Mantener solo los últimos 12 mensajes en pantalla para no saturar el overlay
            if (chatContainer.children.length > 12) {
                chatContainer.removeChild(chatContainer.children[0]);
            }

            // Auto-scroll hacia abajo
            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body><body>
    <div id="chat-container">
        <p>¡Overlay de TikTok conectado correctamente!</p>
    </div>
</body>
</html>
